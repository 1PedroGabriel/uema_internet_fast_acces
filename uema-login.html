<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Acesso UEMA Wi-Fi</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f6f7;
      color: #202b33;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      background: #fff;
      border-top: 6px solid #276489;
      box-shadow: 0 12px 36px #18384a18;
    }
    h1 { margin: 0 0 8px; font-size: 1.45rem; }
    p { line-height: 1.5; }
    .intro { margin: 0 0 22px; color: #52616a; }
    label.field { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type="text"], input[type="password"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #aab6bd;
      border-radius: 3px;
      font: inherit;
    }
    input:focus { outline: 3px solid #27648944; border-color: #276489; }
    .remember {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 18px 0;
      line-height: 1.4;
    }
    .remember input { margin-top: 4px; }
    .warning {
      padding: 11px 12px;
      background: #fff5df;
      border-left: 3px solid #bd7a12;
      color: #493715;
      font-size: .9rem;
    }
    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 3px;
      background: #276489;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1e526f; }
    #status { min-height: 1.5em; margin: 14px 0 0; color: #52616a; }
  </style>
</head>
<body>
  <main>
    <h1>Acesso UEMA Wi-Fi</h1>
    <p class="intro">Conecte-se primeiro à rede UEMA. No primeiro acesso, informe suas credenciais do SIGUEMA.</p>

    <form id="loginForm" method="post" action="http://172.25.50.10/auth/index.html/u">
      <label class="field" for="username">Login</label>
      <input id="username" name="user" type="text" autocomplete="username" required>

      <label class="field" for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <label class="remember">
        <input id="remember" type="checkbox">
        <span>Salvar login e senha neste navegador para tentar entrar automaticamente ao abrir este arquivo.</span>
      </label>

      <p class="warning">Ao salvar, a senha fica em texto simples no armazenamento local do navegador. O portal tambem recebe a senha por HTTP.</p>
      <button id="submitButton" type="submit">Entrar na rede</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (() => {
      const storageKey = "uema-wifi-login";
      const form = document.getElementById("loginForm");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const remember = document.getElementById("remember");
      const status = document.getElementById("status");
      const submitButton = document.getElementById("submitButton");

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && typeof saved.user === "string" && typeof saved.password === "string") {
          username.value = saved.user;
          password.value = saved.password;
          remember.checked = true;
          status.textContent = "Credenciais salvas. Tentando entrar...";
          submitButton.disabled = true;
          window.setTimeout(() => form.requestSubmit(), 500);
        }
      } catch {
        status.textContent = "O armazenamento local nao esta disponivel neste navegador. O login manual continua disponivel.";
      }

      form.addEventListener("submit", (event) => {
        if (remember.checked) {
          try {
            localStorage.setItem(storageKey, JSON.stringify({ user: username.value, password: password.value }));
          } catch {
            event.preventDefault();
            status.textContent = "Nao foi possivel salvar neste navegador. Desmarque a opcao para entrar sem salvar.";
          }
        } else {
          try { localStorage.removeItem(storageKey); } catch { /* Storage may be unavailable for local files. */ }
        }
      });
    })();
  </script>
</body>
</html>
