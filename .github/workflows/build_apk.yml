name: Build Executables (Windows, Android & iOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. GERAÇÃO AUTOMATIZADA DO APK ANDROID
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        id: version
        run: echo "ver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Gerar Estrutura Nativa e Dependências
        run: |
          cd mobile_app
          flutter create --org br.uema.fastaccess --project-name uema_fast_access .
          # Sincroniza a versão do update_checker com a tag do release
          sed -i "s/static const String currentVersion = '[^']*'/static const String currentVersion = '${{ steps.version.outputs.ver }}'/" lib/services/update_checker.dart
          flutter pub get

      - name: Compilar APK Android (Release)
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: UEMA_FastAccess_Android_APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. GERAÇÃO AUTOMATIZADA DO APP iOS
  # ==========================================
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Gerar Estrutura Nativa e Restringir HTTP ao Portal
        run: |
          cd mobile_app
          flutter create --org br.uema.fastaccess --project-name uema_fast_access .
          python3 -c "
          import plistlib
          p_path = 'ios/Runner/Info.plist'
          with open(p_path, 'rb') as fp:
              pl = plistlib.load(fp)
          # Cleartext SOMENTE para o portal UEMA e o probe (anti-vazamento)
          pl['NSAppTransportSecurity'] = {
              'NSExceptionDomains': {
                  '172.25.50.10': {'NSExceptionAllowsInsecureHTTPLoads': True},
                  'msftconnecttest.com': {
                      'NSExceptionAllowsInsecureHTTPLoads': True,
                      'NSIncludesSubdomains': True
                  }
              }
          }
          with open(p_path, 'wb') as fp:
              plistlib.dump(pl, fp)
          "
          flutter pub get

      - name: Compilar App iOS
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Compactar Executável iOS
        run: |
          cd mobile_app/build/ios/iphoneos
          zip -r Runner.zip Runner.app

      - name: Publicar iOS para Download
        uses: actions/upload-artifact@v4
        with:
          name: UEMA_FastAccess_iOS_APP
          path: mobile_app/build/ios/iphoneos/Runner.zip

  # ==========================================
  # 3. GERAÇÃO AUTOMATIZADA DO EXECUTÁVEL WINDOWS
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        id: version
        shell: bash
        run: echo "ver=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gravar arquivo de versão
        run: |
          cd desktop_app
          python -c "import json; json.dump({'version': '${{ steps.version.outputs.ver }}'}, open('version_info.json', 'w'))"

      - name: Compilar Executável
        run: |
          cd desktop_app
          python build.py

      - name: Publicar EXE para Download
        uses: actions/upload-artifact@v4
        with:
          name: UEMA_FastAccess_Windows_EXE
          path: |
            desktop_app/dist/UEMA_Internet_FastAccess.exe
            desktop_app/version_info.json

  # ==========================================
  # 4. PUBLICAÇÃO DE RELEASE (apenas em tags v*)
  # ==========================================
  release:
    name: Publicar Release no GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar APK Android
        uses: actions/download-artifact@v4
        with:
          name: UEMA_FastAccess_Android_APK
          path: artifacts/android

      - name: Baixar EXE Windows
        uses: actions/download-artifact@v4
        with:
          name: UEMA_FastAccess_Windows_EXE
          path: artifacts/windows

      - name: Compactar APK em ZIP
        # Navegadores retêm/bloqueiam .apk direto (Safe Browsing); dentro de
        # um .zip o download conclui normalmente.
        run: |
          cd artifacts/android
          zip UEMA_FastAccess_Android.zip app-release.apk

      - name: Compactar EXE em ZIP
        # O .exe também é retido por navegadores (SmartScreen/Safe Browsing);
        # o ZIP inclui o version_info.json necessário ao updater.
        run: |
          cd artifacts/windows
          zip UEMA_FastAccess_Windows.zip UEMA_Internet_FastAccess.exe version_info.json

      - name: Criar Release com Binários
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/UEMA_FastAccess_Android.zip
            artifacts/windows/UEMA_FastAccess_Windows.zip
          generate_release_notes: true
